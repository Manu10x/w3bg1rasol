<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Girasol</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Poppins', sans-serif;
      background-image: url('campocielo.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .feliz-cumple {
      position: fixed;
      top: 10px;
      left: 15px;
      z-index: 1000;
      color: white;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.8);
      background-color: rgba(0, 0, 0, 0.4);
      padding: 12px 16px;
      border-radius: 10px;
      text-align: left;
    }

    .feliz-cumple h1 {
      font-size: 2.5rem;
      margin: 0;
      font-family: 'Dancing Script', cursive;
    }

    .feliz-cumple p {
      font-size: 1.1rem;
      margin: 5px 0 0 0;
    }

    @media (max-width: 600px) {
      .feliz-cumple h1 {
        font-size: 6vw;
      }

      .feliz-cumple p {
        font-size: 3.5vw;
      }
    }

    .girasol-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      padding: 10px;
      overflow: hidden;
    }

    .girasol {
      position: relative;
      width: 280px;
      height: 280px;
      max-width: 90vw;
      max-height: 90vw;
      animation: flotar 5s ease-in-out infinite;
      --transY: -90px;
    }

    .petalo {
      position: absolute;
      width: 60px;
      height: 100px;
      background: #ffc107;
      border-radius: 50% 50% 0 0;
      transform-origin: bottom center;
      transition: transform 0.3s;
      box-shadow: 0 3px 5px rgba(0,0,0,0.2);
      z-index: 1;
      cursor: pointer;
    }

    .petalo:hover {
      transform: scale(1.1) rotate(var(--rot)) translateY(var(--transY));
    }

    .centro {
      position: absolute;
      width: 177px;
      height: 180px;
      background: #ff3d00;
      border-radius: 50%;
      top: 36%;
      left: 11%;
      transform: translate(-50%, -50%);
      z-index: 2;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
    }

    @keyframes flotar {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    @media (max-width: 600px) {
      .girasol-container {
        justify-content: center;
        align-items: center;
        padding: 10px;
        overflow: hidden;
      }

      .girasol {
        width: 50vw;
        height: 50vw;
        max-width: 50vw;
        max-height: 50vw;
        --transY: -70%;
        margin-left: 113px;
      }

      .petalo {
        width: calc(50vw * 0.21);
        height: calc(50vw * 0.36);
      }

      .centro {
        width: calc(58vw * 0.46);
        height: calc(56vw * 0.46);
      }
    }

    /* Fuente en el modal */
    .modal-content, .modal-title, .modal-body {
      font-family: 'Poppins', sans-serif !important;
    }

  </style>
</head>
<body>

  <!-- Texto de cumpleaños -->
  <div class="feliz-cumple">
    <h1>Feliz cumpleaños Hillary Esther</h1>
    <p>Toca cada pétalo del girasol</p>
  </div>

  <!-- Girasol -->
  <div class="girasol-container">
    <div class="girasol" id="girasol">
      <div class="centro"></div>
    </div>
  </div>

  <!-- Modal Bootstrap -->
  <div class="modal fade" id="modalAmor" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalLabel">🌻 Mensaje de Amor</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body" id="mensajeModal"></div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const mensajes = [
      "Tu amor ilumina mi vida como el sol a un girasol.",
      "Cada pétalo es una razón por la que te amo.",
      "Eres mi sol en los días nublados.",
      "Tu luz hace florecer mi corazón.",
      "Siempre giraré hacia ti, mi sol.",
      "Mi amor por ti gira como este girasol.",
      "Eres la primavera de mi vida.",
      "Te amo más con cada rayo de sol."
    ];

    const girasol = document.getElementById("girasol");

    for (let i = 0; i < 8; i++) {
      const petalo = document.createElement("div");
      petalo.className = "petalo";
      const angle = i * 45;
      petalo.style.transform = `rotate(${angle}deg) translateY(var(--transY))`;
      petalo.style.setProperty("--rot", `${angle}deg`);
      petalo.dataset.index = i;
      petalo.addEventListener("click", () => abrirModal(i));
      girasol.appendChild(petalo);
    }

    function abrirModal(index) {
      document.getElementById("mensajeModal").innerText = mensajes[index];
      const modal = new bootstrap.Modal(document.getElementById("modalAmor"));
      modal.show();
    }
  </script>

</body>
</html>
