<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Feliz Cumpleaños Hillary Esther</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Poppins', sans-serif;
      background-image: url('campocielo.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .feliz-cumple {
      position: fixed;
      top: 10px;
      left: 15px;
      z-index: 1000;
      color: white;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.8);
      background-color: rgba(0, 0, 0, 0.4);
      padding: 12px 16px;
      border-radius: 10px;
      text-align: left;
      max-width: 90%;
    }

    .feliz-cumple h1 {
      font-size: 2.5rem;
      margin: 0;
      font-family: 'Dancing Script', cursive;
    }

    .feliz-cumple p {
      font-size: 1.1rem;
      margin: 5px 0 0 0;
    }

    @media (max-width: 600px) {
      .feliz-cumple {
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
      }

      .feliz-cumple h1 {
        font-size: 8vw;
      }

      .feliz-cumple p {
        font-size: 4vw;
      }
    }

    .girasol-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      padding: 10px;
      overflow: hidden;
    }

    .girasol {
      position: relative;
      width: 280px;
      height: 280px;
      max-width: 90vw;
      max-height: 90vw;
      animation: flotar 5s ease-in-out infinite;
      --transY: -90px;
    }

    .petalo {
      position: absolute;
      width: 60px;
      height: 100px;
      background: #ffc107;
      border-radius: 50% 50% 0 0;
      transform-origin: bottom center;
      transition: transform 0.3s;
      box-shadow: 0 3px 5px rgba(0,0,0,0.2);
      z-index: 1;
      cursor: pointer;
    }

    .petalo:hover {
      transform: scale(1.1) rotate(var(--rot)) translateY(var(--transY));
    }

    .centro {
      position: absolute;
      width: 177px;
      height: 180px;
      background: #ff3d00;
      border-radius: 50%;
      top: 36%;
      left: 11%;
      transform: translate(-50%, -50%);
      z-index: 2;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
    }

    .tallo {
      position: absolute;
      top: 96%;
      left: 11%;
      transform: translateX(-50%);
      width: 16px;
      height: 140px;
      background: linear-gradient(to bottom, #3b7d2a, #1e4d17);
      border-radius: 10px 10px 20px 20px;
      z-index: 0;
      box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.3);
    }

    .hoja {
      position: absolute;
      top: 35%;
      left: 80%;
      width: 80px;
      height: 50px;
      background: radial-gradient(ellipse at center, #4caf50 0%, #2e7d32 70%);
      border-radius: 50% 100% 100% 50% / 60% 100% 100% 60%;
      transform: rotate(30deg);
      box-shadow: inset -5px -5px 10px rgba(0, 0, 0, 0.2),
                  2px 2px 6px rgba(0, 0, 0, 0.2);
      z-index: 0;
    }

    @keyframes flotar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @media (max-width: 600px) {
      .girasol {
        width: 50vw;
        height: 50vw;
        max-width: 50vw;
        max-height: 50vw;
        --transY: -70%;
        margin-left: 113px;
      }

      .petalo {
        width: calc(50vw * 0.21);
        height: calc(50vw * 0.36);
      }

      .centro {
        width: calc(58vw * 0.46);
        height: calc(56vw * 0.46);
      }

      .tallo {
        height: 22vw;
        width: 3vw;
      }

      .hoja {
        width: 14vw;
        height: 9vw;
      }
    }

    .modal-content, .modal-title, .modal-body {
      font-family: 'Poppins', sans-serif !important;
    }

    /* Botón de música */
    #playBtn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 10px 16px;
      font-size: 1rem;
      border: none;
      border-radius: 30px;
      background-color: rgba(255, 255, 255, 0.7);
      color: #333;
      cursor: pointer;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      transition: background 0.3s;
    }

    #playBtn:hover {
      background-color: rgba(255, 255, 255, 0.9);
    }
  </style>
</head>
<body>

  <!-- Mensaje de cumpleaños -->
  <div class="feliz-cumple">
    <h1>Feliz cumpleaños Hillary Esther</h1>
    <p>Toca cada pétalo del girasol</p>
  </div>

  <!-- Girasol -->
  <div class="girasol-container">
    <div class="girasol" id="girasol">
      <div class="centro"></div>
      <div class="tallo">
        <div class="hoja"></div>
      </div>
    </div>
  </div>

  <!-- Modal Bootstrap -->
  <div class="modal fade" id="modalAmor" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalLabel">🌻 Mensaje Para ti </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body" id="mensajeModal"></div>
      </div>
    </div>
  </div>

  <!-- Botón para activar música -->
  <button id="playBtn">🎵 Reproducir música</button>
  <audio id="audio" src="musica.mp3" loop></audio>

  <!-- Bootstrap + JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const mensajes = [
      "Eres una persona increíble, llena de luz y alegría, y de verdad mereces que este día sea tan maravilloso como tú.",
      "Tu sonrisa tiene el poder de alegrar hasta el día más gris.",
      "Eres un ejemplo de belleza, talento y autenticidad. Que este nuevo capítulo sea tan especial y único como tú lo eres para mí.",
      "Tu sonrisa es el mejor regalo que cualquiera podría recibir, nunca dejes de brillar.",
      "Eres única y especial, y mereces un cumpleaños tan maravilloso como tú.",
      "No hay nadie como tú, única y especial en cada detalle.",
      "Cada año te vuelves aún más extraordinaria, que este cumpleaños sea solo el inicio de cosas grandiosas.",
      "Gracias por ser una persona tan auténtica y especial, ¡feliz cumpleaños y que todos tus sueños se hagan realidad!"
    ];

    const girasol = document.getElementById("girasol");

    for (let i = 0; i < 8; i++) {
      const petalo = document.createElement("div");
      petalo.className = "petalo";
      const angle = i * 45;
      petalo.style.transform = `rotate(${angle}deg) translateY(var(--transY))`;
      petalo.style.setProperty("--rot", `${angle}deg`);
      petalo.dataset.index = i;
      petalo.addEventListener("click", () => abrirModal(i));
      girasol.appendChild(petalo);
    }

    function abrirModal(index) {
      document.getElementById("mensajeModal").innerText = mensajes[index];
      const modal = new bootstrap.Modal(document.getElementById("modalAmor"));
      modal.show();
    }

    // Botón para reproducir música
    const audio = document.getElementById('audio');
    const btn = document.getElementById('playBtn');
    btn.addEventListener('click', () => {
      audio.play().then(() => {
        btn.style.display = 'none';
      }).catch((error) => {
        alert("Tu navegador bloqueó la reproducción automática. Toca de nuevo.");
      });
    });
  </script>
</body>
</html>
